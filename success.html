<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pago completado | IN FURGO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f6f6f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      text-align: center;
    }
    .card h1 {
      color: #28a745;
    }
    .card p {
      margin: 15px 0;
    }
    .boton {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #ffd500;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.2s;
    }
    .boton:hover {
      background-color: #ffcc00;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✅ ¡Pago completado!</h1>
    <p>Gracias por tu compra. Estamos preparando tu pedido con mucho cuidado.</p>
    <p>Recibirás un email con los detalles del pago.</p>
    <a class="boton" href="index.html">Volver a la tienda</a>
  </div>
</body>
</html>
